services:
  draft-bot:
    build: .
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - GUILD_ID=${GUILD_ID}
      - SUPER_ADMINS=${SUPER_ADMINS}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    volumes:
      - ./data:/app/data   # persist draft state across restarts
      - ./logs:/app/logs   # persist logs across rebuilds
    command: >
      sh -c "GUILD_ID= node build/deploy-commands.js &&
             node build/index.js 2>&1 | tee -a /app/logs/bot.log"
    restart: unless-stopped
