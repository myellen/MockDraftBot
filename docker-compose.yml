services:
  draft-bot:
    build: .
    depends_on:
      ollama:
        condition: service_started
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - GUILD_ID=${GUILD_ID}
      - SUPER_ADMINS=${SUPER_ADMINS}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL}
      - OLLAMA_EMBED_HOST=${OLLAMA_EMBED_HOST}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - LOG_PROMPTS=${LOG_PROMPTS}
      - DRAFT_MODE=${DRAFT_MODE}
      - WEB_PORT=3100
      - WEB_AUTH_SECRET=${WEB_AUTH_SECRET}
    volumes:
      - ./data:/app/data   # persist draft state across restarts
      - ./logs:/app/logs   # persist logs across rebuilds
    command: >
      sh -c "sh scripts/wait-for-ollama.sh &&
             GUILD_ID= node build/deploy-commands.js &&
             node build/index.js 2>&1 | tee -a /app/logs/bot.log"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://draft-bot:3100
    depends_on:
      - draft-bot
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama-data:
